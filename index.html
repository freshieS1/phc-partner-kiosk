  :root{
    --bg:#050607;
    --card:#111414;
    --card-border:#1f2626;
    --accent:#2fb8ac;
    --accent-dim:#1c6a63;
    --text:#f5f7f6;
    --text-dim:#9fb0ae;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  #app{position:fixed; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:28px 40px 18px;
    border-bottom:1px solid var(--card-border);
  }
  .wordmark{
    font-weight:800; letter-spacing:0.14em; text-transform:uppercase;
    font-size:15px; color:var(--text-dim);
  }
  .wordmark b{color:var(--accent);}
  .section-label{
    font-weight:800; letter-spacing:0.1em; text-transform:uppercase;
    font-size:13px; color:var(--accent);
  }
  .back-btn{
    appearance:none; border:1px solid var(--card-border); background:transparent;
    color:var(--text); font-weight:700; letter-spacing:0.03em;
    padding:12px 22px; border-radius:999px; font-size:16px;
    display:flex; align-items:center; gap:8px; cursor:pointer;
    font-family:inherit;
  }
  .back-btn:active{background:var(--card-border);}

  /* ---------- Grid / landing screen ---------- */
  .grid-screen{padding:36px 40px 80px; max-width:1400px; margin:0 auto;}
  .headline{
    font-weight:800; text-transform:uppercase; letter-spacing:0.01em;
    font-size:clamp(30px, 4.2vw, 54px); line-height:1.05; margin:18px 0 10px;
    max-width:16ch;
  }
  .subhead{
    font-size:clamp(16px, 1.6vw, 20px); color:var(--text-dim);
    max-width:62ch; line-height:1.5; margin:0 0 40px; font-weight:400;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  }
  .tile-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:24px;
  }
  .tile{
    background:var(--card); border:1px solid var(--card-border); border-radius:18px;
    padding:0; cursor:pointer; text-align:left; overflow:hidden;
    display:flex; flex-direction:column; align-items:stretch;
    transition:border-color .15s, transform .15s;
    font-family:inherit;
  }
  .tile:active{transform:scale(0.97); border-color:var(--accent);}
  .tile-visual{
    position:relative; width:100%; aspect-ratio:16/10; background:#0b0f0f; overflow:hidden;
  }
  .tile-visual svg, .tile-visual img{width:100%; height:100%; object-fit:cover; object-position:center 25%; display:block;}
  .hero-photo-wrap{position:relative; width:100%; height:100%; overflow:hidden; z-index:0;}
  .hero-backdrop{
    position:absolute; inset:-20px; background-size:cover; background-position:center;
    filter:blur(30px) brightness(0.45) saturate(1.1); transform:scale(1.15); z-index:0;
  }
  .hero-photo-wrap .hero-photo{position:relative; width:100%; height:100%; object-fit:contain; object-position:center; display:block; z-index:1;}
  .tile-badge{
    position:absolute; left:18px; bottom:-24px; width:56px; height:56px;
    border-radius:50%; border:3px solid var(--card); box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .tile-info{padding:34px 20px 22px; display:flex; flex-direction:column; gap:10px;}
  .avatar{
    width:100%; height:100%; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:22px; color:#04211e;
    flex:none; overflow:hidden;
  }
  .avatar img{width:100%; height:100%; object-fit:cover;}
  .tile-name{
    font-weight:800; text-transform:uppercase; font-size:19px; letter-spacing:0.01em;
    line-height:1.15;
  }
  .tile-tagline{
    color:var(--text-dim); font-size:14.5px; line-height:1.45;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; font-weight:400;
  }
  .tile.placeholder{border-style:dashed; opacity:0.55;}
  .tile.placeholder .tile-tagline{font-style:italic;}

  /* ---------- Detail screen ---------- */
  .detail-screen{padding:0 0 80px; max-width:900px; margin:0 auto;}
  .detail-hero-visual{
    position:relative; width:100%; aspect-ratio:21/9; max-height:340px; overflow:hidden;
    background:#0b0f0f;
  }
  .detail-hero-visual svg, .detail-hero-visual img{width:100%; height:100%; object-fit:cover; object-position:center 25%; display:block;}
  .detail-hero-scrim{
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(5,6,7,0.95) 0%, rgba(5,6,7,0.6) 40%, rgba(5,6,7,0) 100%);
  }
  .detail-hero{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; align-items:center; gap:18px;
    padding:0 40px 24px;
  }
  .detail-hero .avatar{width:100%; height:100%; font-size:26px;}
  .detail-hero .tile-badge{position:static; width:76px; height:76px; flex:none;}
  .detail-name{font-weight:800; text-transform:uppercase; font-size:clamp(22px,3vw,34px); line-height:1.1;}
  .detail-tagline{color:var(--text-dim); font-size:16px; margin-top:6px; font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;}
  .detail-body{padding:28px 40px 0;}
  .section-card{
    background:var(--card); border:1px solid var(--card-border); border-radius:16px;
    padding:24px 26px; margin-bottom:18px;
  }
  .stats-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));
    gap:20px 16px; margin-top:14px;
  }
  .stat-value{font-weight:800; font-size:34px; color:var(--accent); line-height:1;}
  .stat-label{
    color:var(--text-dim); font-size:12.5px; text-transform:uppercase;
    letter-spacing:0.05em; font-weight:700; margin-top:6px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  }
  .section-heading{
    font-weight:800; text-transform:uppercase; letter-spacing:0.06em;
    font-size:13px; color:var(--accent); margin-bottom:10px;
  }
  .section-body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; font-size:16.5px; line-height:1.6;
    color:var(--text); font-weight:400; white-space:pre-line;
  }
  .footer-back{padding:8px 40px 0;}
  .footer-back .back-btn{width:100%; justify-content:center; padding:16px;}

  .testimonial-card{
    background:var(--card); border:1px solid var(--card-border); border-left:4px solid var(--accent);
    border-radius:12px; padding:22px 24px; margin-bottom:14px;
  }
  .testimonial-quote{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; font-size:17px; line-height:1.55; font-style:italic;
    color:var(--text);
  }
  .testimonial-quote::before{content:"\201C";}
  .testimonial-quote::after{content:"\201D";}
  .testimonial-attribution{
    margin-top:12px; font-size:13px; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--text-dim); font-weight:700; font-style:normal;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  }
  .testimonial-card.pending{border-left-color:var(--card-border); border-style:dashed; opacity:0.6;}

  .qr-card{
    display:flex; align-items:center; gap:20px;
    background:var(--card); border:1px solid var(--card-border); border-radius:16px;
    padding:22px 24px; margin-bottom:18px;
  }
  .qr-card.pending{border-style:dashed; opacity:0.6;}
  .qr-box{
    width:96px; height:96px; border-radius:8px; background:#fff; flex:none;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .qr-box img{width:100%; height:100%; object-fit:contain;}
  .qr-box .qr-missing{color:#050607; font-size:11px; text-align:center; padding:6px; font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;}
  .qr-text{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; font-size:14.5px; color:var(--text-dim); line-height:1.5;}
  .qr-label{font-weight:800; text-transform:uppercase; letter-spacing:0.06em; font-size:13px; color:var(--accent); margin-bottom:6px;}

  .sources{
    padding:4px 40px 0; margin-top:4px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; font-size:12.5px; color:var(--text-dim); line-height:1.7;
  }
  .sources .sources-label{
    text-transform:uppercase; letter-spacing:0.06em; font-weight:800; color:var(--text-dim);
    display:block; margin-bottom:6px; font-size:11.5px;
  }
  .sources a{color:var(--accent); text-decoration:none;}

  .fade-in{animation:fadeIn .22s ease-out;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .hidden{display:none !important;}
</style>
</head>

  }

  function initials(name){
    return name.trim().split(/\s+/).map(w => w[0]).slice(0,2).join("").toUpperCase();
  }

  function colorFor(name){
    let hash = 0;
    for (let i=0; i<name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
  }

  function avatarHtml(partner){
    if (partner.logo) {
      return `<div class="avatar"><img src="${escapeHtml(partner.logo)}" alt=""></div>`;
    }
    const bg = colorFor(partner.name);
    return `<div class="avatar" style="background:${bg}">${escapeHtml(initials(partner.name))}</div>`;
  }

  // Original duotone nature vignettes (hand-drawn SVG, not photography) used as a
  // stand-in hero image for any partner without a real supplied photo. Never a
  // substitute for a real, rights-cleared photo once one's provided via
  // partner.heroImage — this exists so the kiosk still looks intentional and
  // finished before that arrives, without lifting anyone else's copyrighted or
  // credited photography to fill the gap.
  const SCENES = [
    // Mountains at dawn
    `<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <rect width="400" height="225" fill="#07100f"/>
      <circle cx="300" cy="70" r="46" fill="#2fb8ac" opacity="0.35"/>
      <circle cx="300" cy="70" r="26" fill="#4fe0d1" opacity="0.6"/>
      <polygon points="0,225 90,90 150,160 210,70 300,225" fill="#123330"/>
      <polygon points="120,225 220,110 300,190 400,120 400,225" fill="#1c6a63" opacity="0.85"/>
      <polygon points="0,225 60,150 140,225" fill="#0c211f"/>
    </svg>`,
    // Forest with light rays
    `<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <rect width="400" height="225" fill="#08130f"/>
      <g opacity="0.25" fill="#4fe0d1">
        <polygon points="60,0 90,225 30,225"/>
        <polygon points="180,0 215,225 145,225"/>
        <polygon points="320,0 355,225 285,225"/>
      </g>
      <g fill="#123330">
        <polygon points="60,60 100,225 20,225"/>
        <polygon points="150,90 190,225 110,225"/>
        <polygon points="250,50 296,225 204,225"/>
        <polygon points="340,90 380,225 300,225"/>
      </g>
    </svg>`,
    // Park pond
    `<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <rect width="400" height="225" fill="#07110f"/>
      <rect y="150" width="400" height="75" fill="#123330"/>
      <ellipse cx="200" cy="160" rx="180" ry="14" fill="#1c6a63" opacity="0.5"/>
      <circle cx="330" cy="45" r="22" fill="#2fb8ac" opacity="0.5"/>
      <path d="M40 130 Q60 110 80 130 Q100 150 120 130" stroke="#2fb8ac" stroke-width="3" fill="none" opacity="0.7"/>
      <path d="M240 100 Q260 85 280 100" stroke="#4fe0d1" stroke-width="3" fill="none" opacity="0.6"/>
    </svg>`,
    // Rolling meadow
    `<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <rect width="400" height="225" fill="#081311"/>
      <circle cx="90" cy="55" r="30" fill="#2fb8ac" opacity="0.4"/>
      <path d="M0,150 Q100,100 200,150 T400,150 V225 H0 Z" fill="#123330"/>
      <path d="M0,180 Q120,140 240,180 T400,175 V225 H0 Z" fill="#1c6a63" opacity="0.85"/>
    </svg>`
  ];

  function sceneFor(name){
    let hash = 0;
    for (let i=0; i<name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return SCENES[Math.abs(hash) % SCENES.length];
  }

  function heroVisualHtml(partner){
    if (partner.heroImage) {
      // A real supplied photo is shown whole (object-fit:contain) rather than
      // cropped to fill the banner — cropping an arbitrary photo (e.g. a square
      // headshot) to a wide banner tends to cut off the person's face. A blurred,
      // darkened copy of the same photo fills the rest of the frame so there's
      // no empty letterboxing on either side.
      const url = escapeHtml(partner.heroImage);
      return `<div class="hero-photo-wrap">
        <div class="hero-backdrop" style="background-image:url('${url}')"></div>
        <img class="hero-photo" src="${url}" alt="">
      </div>`;
    }
    return sceneFor(partner.name);
  }

  function renderGrid(){
    clearIdleTimer();
    const tiles = PARTNERS.map(p => `
      <button class="tile ${p.placeholder ? 'placeholder' : ''}" data-id="${p.id}">
        <div class="tile-visual">
          ${heroVisualHtml(p)}
          <div class="tile-badge">${avatarHtml(p)}</div>
        </div>
        <div class="tile-info">
          <div class="tile-name">${escapeHtml(p.name)}</div>
          <div class="tile-tagline">${escapeHtml(p.tagline)}</div>
        </div>
      </button>
    `).join("");

    app.innerHTML = `
      <div class="topbar">
        <div class="wordmark">Planetary <b>Guardians</b></div>
        <div class="section-label">Our Partners</div>
      </div>
      <div class="grid-screen fade-in">
        <div class="headline">Meet some of the partners doing incredible work to improve planetary and human health</div>
        <div class="subhead">Tap a partner below to learn more about their work.</div>
        <div class="tile-grid">${tiles}</div>
      </div>
    `;

    app.querySelectorAll(".tile").forEach(btn => {
      btn.addEventListener("click", () => showDetail(btn.dataset.id));
    });
  }

  function renderDetail(partner){
    const sections = partner.sections.map(s => `
      <div class="section-card">
        <div class="section-heading">${escapeHtml(s.heading)}</div>
        <div class="section-body">${escapeHtml(s.body)}</div>
      </div>
    `).join("");

    let statsBlock = "";
    if (partner.stats && partner.stats.items && partner.stats.items.length) {
      const items = partner.stats.items.map(it => `
        <div>
          <div class="stat-value">${escapeHtml(it.value)}</div>
          <div class="stat-label">${escapeHtml(it.label)}</div>
        </div>
      `).join("");
      statsBlock = `
        <div class="section-card">
          <div class="section-heading">${escapeHtml(partner.stats.heading || 'By the Numbers')}</div>
          <div class="stats-grid">${items}</div>
        </div>
      `;
    }

    const testimonials = (partner.testimonials || []).map(t => `
      <div class="testimonial-card ${t.pending ? 'pending' : ''}">
        <div class="testimonial-quote">${escapeHtml(t.quote)}</div>
        <div class="testimonial-attribution">${escapeHtml(t.attribution || '')}</div>
      </div>
    `).join("");
    const testimonialsBlock = testimonials ? `
      <div class="section-heading" style="padding:0 0 4px;">Patient Testimonials</div>
      ${testimonials}
    ` : "";

    let qrBlock = "";
    if (partner.qr) {
      const q = partner.qr;
      const qrInner = (q.image && !q.pending)
        ? `<img src="${escapeHtml(q.image)}" alt="QR code">`
        : `<div class="qr-missing">QR<br>pending</div>`;
      qrBlock = `
        <div class="qr-card ${q.pending ? 'pending' : ''}">
          <div class="qr-box">${qrInner}</div>
          <div class="qr-text"><div class="qr-label">Learn more</div>${escapeHtml(q.caption || '')}</div>
        </div>
      `;
    }

    let sourcesBlock = "";
    if (partner.sources && partner.sources.length) {
      const links = partner.sources.map(s =>
        `<div>${escapeHtml(s.label)}${s.url ? ` — <a href="${escapeHtml(s.url)}">${escapeHtml(s.url)}</a>` : ''}</div>`
      ).join("");
      sourcesBlock = `<div class="sources"><span class="sources-label">Sources</span>${links}</div>`;
    }

    let websiteBlock = "";
    if (partner.website) {
      // Plain text, not a live link — the kiosk stays leak-proof (no outbound
      // navigation from its own locked-down browser); a real visit happens via
      // the partner's QR code on the visitor's own phone instead.
      websiteBlock = `<div class="sources"><span class="sources-label">Website</span><div>${escapeHtml(partner.website)}</div></div>`;
    }

    app.innerHTML = `
      <div class="topbar">
        <button class="back-btn" id="back-top">‹ Back to partners</button>
        <div class="section-label">Our Partners</div>
      </div>
      <div class="detail-screen fade-in">
        <div class="detail-hero-visual">
          ${heroVisualHtml(partner)}
          <div class="detail-hero-scrim"></div>
          <div class="detail-hero">
            <div class="tile-badge">${avatarHtml(partner)}</div>
            <div>
              <div class="detail-name">${escapeHtml(partner.name)}</div>
              <div class="detail-tagline">${escapeHtml(partner.tagline)}</div>
            </div>
          </div>
        </div>
        <div class="detail-body">
          ${sections}
          ${statsBlock}
          ${qrBlock}
          ${testimonialsBlock}
        </div>
        ${sourcesBlock}
        ${websiteBlock}
        <div class="footer-back">
          <button class="back-btn" id="back-bottom">‹ Back to all partners</button>
        </div>
      </div>
    `;

    app.querySelector("#back-top").addEventListener("click", renderGrid);
    app.querySelector("#back-bottom").addEventListener("click", renderGrid);

    app.scrollTop = 0;
    resetIdleTimer();
  }

  function showDetail(id){
    const partner = PARTNERS.find(p => p.id === id);
    if (!partner) return;
    renderDetail(partner);
  }

  function resetIdleTimer(){
    clearIdleTimer();
    idleTimer = setTimeout(renderGrid, IDLE_MS);
  }
  function clearIdleTimer(){
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = null;
  }

  // Any interaction while on a detail screen resets the idle clock;
  // no-op while on the grid (clearIdleTimer keeps it off there).
  ["click","touchstart","keydown"].forEach(evt => {
    document.addEventListener(evt, () => { if (idleTimer) resetIdleTimer(); }, {passive:true});
  });

  renderGrid();
</script>
</body>
</html>
